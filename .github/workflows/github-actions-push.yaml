name: Build and Test
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.10"
      - name: Build
        run: go build -v ./...
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test with the Go CLI
        run: go test
